[package]
name = "cutcraft-web-m0"
description = "Milestone 0: the front, a preparation worker per session, and the browser API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cutcraft-web-protocol = { path = "../../../crates/protocol" }
cutcraft-control = { path = "../../../../../cutcraft/crates/control" }
cutcraft-path = { path = "../../../../../cutcraft/crates/path" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util", "process", "fs"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
rlimit = "0.10"
futures-util = "0.3"

[lints]
workspace = true
