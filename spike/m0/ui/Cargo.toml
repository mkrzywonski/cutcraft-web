[package]
name = "cutcraft-web-m0-ui"
description = "Milestone 0: the desktop layout's slice in the browser (eframe web runner)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cutcraft-web-protocol = { path = "../../../crates/protocol" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wgpu: WebGPU where the browser has it, WebGL2 otherwise (spec §3), as VectorCraft's web build.
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.36"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "File", "FileList", "Blob", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "WebSocket", "MessageEvent", "Event", "Location", "Performance"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
