[workspace]
resolver = "3"
members = ["crates/protocol"]
# The milestone 0 spike builds against local checkouts of the old repositories; it is its own
# workspace and is replaced in milestone 1 (spec §5.2).
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
