<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CutCraft · M5 mobile layout study</title>
<style>
*{box-sizing:border-box}body{margin:0;font:17px/1.45 system-ui,sans-serif;color:#203632;background:#edf2f0}button,select,input{font:inherit;min-height:48px;border:1px solid #b5c8c1;border-radius:10px;background:white;color:inherit;padding:10px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #c57422;outline-offset:2px}button.primary{background:#096b5b;color:white;border-color:#096b5b}button.danger{background:#b52d35;color:white;min-height:64px}h1{font-size:21px;margin:0}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0 16px}small{font-size:14px}.study{background:#203632;color:white;padding:8px 16px;font-size:13px}.study a{color:#b7eadb}header{display:flex;gap:12px;align-items:center;padding:16px;background:white;border-bottom:1px solid #d7e1dd}header .title{flex:1;min-width:0}main{max-width:840px;margin:auto;padding:16px 16px 108px}.row{display:flex;gap:8px;align-items:center;margin-bottom:12px}.row>*{min-width:0;flex:1}.status{font-size:14px;color:#34685a;margin-bottom:12px}.card,details{border:1px solid #ccdcd5;border-radius:14px;background:white;padding:16px;margin-bottom:12px}.canvas{background:#fff;border:1px solid #ccdcd5;border-radius:14px;display:flex;min-height:260px;align-items:center;justify-content:center;margin-bottom:16px}.pane{flex:1;min-width:0;text-align:center}.pane small{display:block;padding-top:10px}.pane svg{width:100%;max-height:310px}.canvas.compare .pane+.pane{border-left:1px solid #ccdcd5}.lines .art{fill:none;stroke:#13766a;stroke-width:2}.overlay .art{stroke:#d34b67;stroke-width:2}.mat{background:repeating-linear-gradient(0deg,transparent 0 24px,#d7e4dd 24px 25px),repeating-linear-gradient(90deg,#f1f6f2 0 24px,#d7e4dd 24px 25px)}.mat svg{width:60%}summary{cursor:pointer;min-height:32px;font-weight:650}label{display:block;margin:16px 0 4px}input{width:100%}input[type=checkbox]{width:24px;min-height:24px;vertical-align:middle;margin-right:8px}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #c2d4cb;display:flex;padding:8px 8px max(8px,env(safe-area-inset-bottom));gap:4px}nav button{flex:1;border:0;font-size:14px;padding:8px 4px}nav button[aria-current=page]{background:#d9eee6;color:#064e41;font-weight:700}.hint{color:#5e746c;font-size:14px}.cutbar{position:sticky;bottom:86px;background:white;padding:12px;border:1px solid #ccdcd5;border-radius:14px}.hidden{display:none!important}@media(min-width:700px){main{padding-bottom:110px}.canvas{min-height:170px}.pane svg{max-height:210px}}@media(prefers-reduced-motion:no-preference){button{transition:background .12s}}
@media(min-width:700px) and (max-height:500px){
.study{padding:2px 12px;font-size:11px}header{padding:4px 16px}header small{display:none}header h1{font-size:18px}main{padding-top:8px;padding-bottom:84px}.status{display:none}.row{margin-bottom:8px}.canvas{min-height:150px;margin-bottom:8px}.pane svg{max-height:150px}.pane small{padding:0;font-size:12px}main>.hint{display:none}nav{padding:4px 8px}header button{min-height:48px;padding:6px}
}
</style>
<div class="study">Design study · no cutter connection · <a href="../mobile-design.md">Read guide</a></div>
<header><button id="back" class="hidden" onclick="show('design')">← Back</button><div class="title"><h1 id="title">Mountain badge</h1><small id="subtitle">Example design · saved</small></div><button id="actions" onclick="show('actions')">Actions</button></header>
<main id="main"></main>
<nav aria-label="Main navigation"><button data-page="design" onclick="show('design')">Design</button><button data-page="library" onclick="show('library')">Library</button><button data-page="cutters" onclick="show('cutters')">Cutters</button><button data-page="settings" onclick="show('settings')">Settings</button></nav>
<script>
const main=document.querySelector('main');let view='Artwork';let current='design';
const art=`<svg viewBox="0 0 300 260" role="img" aria-label="Schematic mountain badge"><circle class="art" cx="150" cy="125" r="94" fill="#e6c994"/><path class="art" d="M64 178L127 75 164 129 189 98 238 178Z" fill="#407a69"/><path class="art" d="M110 103L127 75 145 102 132 96 123 108Z" fill="#fff"/></svg>`;
const groups=['Issues','Info','Artwork size','What to cut','Material','Mat','Media','Cut lines','Cutting aids','Estimate'];
function canvas(){const cls=view==='Cut lines'?'lines':view==='Overlay'?'overlay':view==='Cut Preview'?'mat':'';return `<div class="canvas ${cls} ${view==='Compare'?'compare':''}"><div class="pane">${view==='Compare'?'<small>Artwork</small>':''}${art}</div>${view==='Compare'?`<div class="pane lines"><small>Cut lines</small>${art}</div>`:''}</div>`}
function material(){return `<p class="hint">Illustrative fields only. These do not save a preset.</p><label>Preset<select style="width:100%"><option>Example vinyl</option></select></label>${[['Blade depth',2],['Force',12],['Speed',5],['Passes',1],['Overcut (mm)',0]].map(([name,n])=>`<label>${name}<input type="number" value="${n}" step="${name.startsWith('Overcut')?'0.1':'1'}"></label>`).join('')}<label><input type="checkbox">Mirrored</label><div class="row" style="margin-top:16px"><button onclick="note('Preset Save is illustrated here; no settings were saved.')">Save</button><button onclick="note('Save As opens a name form in the product.')">Save As…</button></div>`}
function note(s){document.getElementById('notice').textContent=s}
function show(p){current=p;document.getElementById('back').classList.toggle('hidden',['design','library','cutters','settings'].includes(p));document.getElementById('title').textContent=p==='design'?'Mountain badge':p==='cut'?'Cut review':p==='active'?'Cut in progress':p==='test'?'Test cut':p[0].toUpperCase()+p.slice(1);document.getElementById('subtitle').textContent='Layout example · no live state';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===p?'page':'false'));
let content='';
if(p==='design'){if(view==='Compare'&&innerWidth<700)view='Artwork';content=`<div class="status">✓ Ready to cut · Example vinyl</div><div class="row"><select aria-label="Preview view" onchange="view=this.value;show('design')">${['Artwork','Cut lines','Overlay','Cut Preview',...(innerWidth>=700?['Compare']:[])].map(v=>`<option ${v===view?'selected':''}>${v}</option>`).join('')}</select><button onclick="show('controls')">Controls</button></div>${canvas()}<p class="hint">${view==='Cut Preview'?'Stationary mat overview. Use Controls for precise placement.':'Artwork and cut lines keep the same framing when you switch.'}</p><div class="row"><button onclick="show('test')">▧ Test Cut</button><button class="primary" onclick="show('cut')">Cut →</button></div><p class="hint">Rotate or widen this study to see Compare. All workflows remain available in portrait.</p>`}
else if(p==='controls'){content=`<p>All ten panel groups, with room to edit. Back returns to the same preview.</p>${groups.map(g=>`<details ${g==='Material'?'open':''}><summary>${g}</summary>${g==='Material'?material():`<p class="hint">${g==='Issues'?'No blocking issues in this example.':g==='Media'?'Width, height and position fields belong here; dragging is optional.':g==='What to cut'?'Colour/layer rows keep their inclusion checkboxes.':'Full reference controls belong here. See the guide for the complete inventory.'}</p>`}</details>`).join('')}`}
else if(['cut','test'].includes(p)){content=`<div class="card"><h2>${p==='test'?'Test pattern':'Mountain badge'}</h2><p>Example vinyl · blade 2 · force 12 · speed 5 · 1 pass</p><p>1. Fit the selected tool.<br>2. Place material on the mat.<br>3. Load the mat in the cutter.</p><p class="hint">The real screen requires verified readiness and an explicit Start. This study has no Start command.</p></div><div class="row"><button onclick="show('design')">Exit</button><button class="primary" onclick="show('active')">Show active example</button></div>`}
else if(p==='active'){content=`<div class="card"><h2>Illustrative progress · 42%</h2><progress style="width:100%" value="42" max="100">42%</progress><p>No cutter is connected. These buttons only demonstrate placement.</p></div>${canvas()}<div class="cutbar"><div class="row"><button onclick="note('Example only: a real pause remains pending until acknowledged.')">Pause</button><button class="danger" onclick="show('cut')">Stop example</button></div></div>`}
else if(p==='actions'){content=`<div class="card"><h2>Project actions</h2>${['Open…','Save','Save As…','Download…','Update from Design…','Undo','Redo','History','Help / Troubleshooting'].map(a=>`<button style="display:block;width:100%;margin-top:8px;text-align:left" onclick="note('This study illustrates the ${a.replaceAll('…','')} route only.')">${a}</button>`).join('')}</div>`}
else{const cards=p==='library'?['Projects and folders','Search and sort','Recently deleted']:p==='cutters'?['Available cutters','Queue and loading','Connection status']:['Materials','Mats','Preferences and fonts','Accounts and backup','AI connection','Help'];content=`<p class="hint">Navigation and card sizing study. Full functionality is specified in the guide.</p>${cards.map(c=>`<div class="card"><h2>${c}</h2><p>${p==='settings'?'Open a focused page; return here without losing the design.':'Keep lists and actions readable at phone width.'}</p></div>`).join('')}`}
main.innerHTML=content+'<p id="notice" role="status"></p>';window.scrollTo(0,0)}
show('design');addEventListener('resize',()=>{if(current==='design')show('design')});
</script>
</html>
